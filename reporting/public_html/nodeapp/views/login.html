<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Analytics Reporting</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-page">
  <noscript><div class="noscript-warning">JavaScript is required to use this application.</div></noscript>

  <main>
    <div class="login-title">
      <h1>Analytics Reporting</h1>
      <p>Role-based access with section-level permissions</p>
    </div>

    <div id="error" class="error-banner" role="alert" hidden></div>

    <div class="form-grid">
      <section class="card" aria-labelledby="signin-heading">
        <h3 id="signin-heading">Sign In</h3>
        <form method="POST" action="/login">
          <label for="login-user">Username</label>
          <input type="text" id="login-user" name="username" autocomplete="username" required />
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" name="password" autocomplete="current-password" required />
          <button type="submit" style="margin-top:1.25rem; width:100%;">Sign In</button>
        </form>
      </section>

      <section class="card" aria-labelledby="signup-heading">
        <h3 id="signup-heading">Create Account</h3>
        <form method="POST" action="/signup">
          <label for="signup-user">Username</label>
          <input type="text" id="signup-user" name="username" autocomplete="username" required />
          <label for="signup-name">Display Name</label>
          <input type="text" id="signup-name" name="display_name" autocomplete="name" />
          <label for="signup-pass">Password</label>
          <input type="password" id="signup-pass" name="password" autocomplete="new-password" required />
          <label for="signup-role">Role</label>
          <select id="signup-role" name="role">
            <option value="viewer">Viewer</option>
            <option value="analyst">Analyst</option>
            <option value="super_admin">Super Admin</option>
          </select>
          <fieldset>
            <legend>Analyst Sections</legend>
            <label><input type="checkbox" name="sections" value="performance" /> Performance</label>
            <label><input type="checkbox" name="sections" value="behavioral" /> Behavioral</label>
            <label><input type="checkbox" name="sections" value="errors" /> Errors</label>
          </fieldset>
          <button type="submit" style="margin-top:0.5rem; width:100%;">Create Account</button>
        </form>
        <p class="muted" style="font-size:0.78rem; margin-top:0.75rem;">Viewers see saved reports only. Analysts get report access plus selected sections.</p>
      </section>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      const box = document.getElementById('error');
      box.textContent = error;
      box.hidden = false;
    }
  </script>
</body>
</html>
