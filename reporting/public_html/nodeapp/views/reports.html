<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Analytics Reporting</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <noscript><div class="noscript-warning">JavaScript is required to use this application.</div></noscript>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <h1>Analytics Reporting</h1>
      <nav aria-label="Main navigation">
        <a href="/dashboard">Dashboard</a>
        <a href="/reports" class="active" aria-current="page">Reports</a>
        <a href="/logout">Logout</a>
      </nav>
    </div>
  </header>

  <div class="page-title-bar">
    <div class="title-inner">
      <div>
        <h2>Reports</h2>
        <p class="subtitle">Select a report to view detailed analytics with charts, tables, and analyst commentary.</p>
      </div>
    </div>
  </div>

  <main id="main-content" class="container">
    <div id="reportList" class="grid-auto" role="list">
      <div class="card skeleton" style="height:120px;" aria-hidden="true"></div>
      <div class="card skeleton" style="height:120px;" aria-hidden="true"></div>
      <div class="card skeleton" style="height:120px;" aria-hidden="true"></div>
    </div>
  </main>

  <script>
    const REPORT_ROUTES = {
      'performance-snapshot': '/reports/performance',
      'behavior-performance-overview': '/reports/behavioral',
      'error-analysis': '/reports/errors'
    };


    async function loadReports() {
      const res = await fetch('/api/reports');
      const list = document.getElementById('reportList');

      if (!res.ok) {
        list.innerHTML = '<p class="muted">Unable to load reports.</p>';
        return;
      }

      const { reports } = await res.json();
      if (!reports.length) {
        list.innerHTML = '<p class="muted">No reports available for your access level.</p>';
        return;
      }

      list.innerHTML = reports.map(report => {
        const route = REPORT_ROUTES[report.slug];
        const tags = report.sections.map(s => `<span class="section-tag">${s}</span>`).join('');

        return route
          ? `<a href="${route}" class="card-link" role="listitem">
              <article class="card report-card">
                <h3>${report.name}</h3>
                <p class="report-desc">${report.description || 'No description.'}</p>
                <div>${tags}</div>
              </article>
            </a>`
          : `<div role="listitem">
              <article class="card report-card">
                <h3>${report.name}</h3>
                <p class="report-desc">${report.description || 'No description.'}</p>
                <div>${tags}</div>
              </article>
            </div>`;
      }).join('');
    }

    loadReports();
  </script>
</body>
</html>
