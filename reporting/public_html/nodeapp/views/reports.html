<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <noscript><div class="noscript-warning">JavaScript is required to use this application.</div></noscript>

  <header class="site-header">
    <div class="header-inner">
      <h1>Analytics Reporting</h1>
      <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/reports" class="active">Reports</a>
        <a href="/logout">Logout</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <h2>Reports</h2>
    <p class="muted">Viewers see saved reports. Analysts and admins see reports matching their allowed sections.</p>
    <div id="reportList"></div>
  </div>

  <script>
    const REPORT_ROUTES = {
      'performance-snapshot': '/reports/performance',
      'behavior-performance-overview': '/reports/behavioral',
      'error-analysis': '/reports/errors'
    };

    async function loadReports() {
      const res = await fetch('/api/reports');
      if (!res.ok) {
        document.getElementById('reportList').innerHTML = '<p>Unable to load reports.</p>';
        return;
      }

      const payload = await res.json();
      const reportList = document.getElementById('reportList');
      reportList.innerHTML = '';

      if (!payload.reports.length) {
        reportList.innerHTML = '<p>No reports available for your access level yet.</p>';
        return;
      }

      payload.reports.forEach((report) => {
        const route = REPORT_ROUTES[report.slug];
        const wrap = document.createElement(route ? 'a' : 'div');
        if (route) {
          wrap.href = route;
          wrap.className = 'card-link';
        }
        wrap.innerHTML = `
          <section class="card">
            <h2>${report.name}</h2>
            <p class="muted">${report.description || 'No description provided.'}</p>
            <div>${report.sections.map((s) => `<span class="section-tag">${s}</span>`).join('')}</div>
          </section>
        `;
        reportList.appendChild(wrap);
      });
    }

    loadReports();
  </script>
</body>
</html>
