<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Analytics Reporting</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.zingchart.com/zingchart.min.js" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <noscript><div class="noscript-warning">JavaScript is required to use this application.</div></noscript>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <h1>Analytics Reporting</h1>
      <nav aria-label="Main navigation">
        <a href="/dashboard" class="active" aria-current="page">Dashboard</a>
        <a href="/reports">Reports</a>
        <a href="/logout">Logout</a>
      </nav>
    </div>
  </header>

  <div class="page-title-bar">
    <div class="title-inner">
      <div>
        <h2 id="welcome">Loading...</h2>
        <p class="subtitle" id="accessInfo"></p>
      </div>
      <div id="permissionPills"></div>
    </div>
  </div>

  <main id="main-content" class="container">

    <!-- KPI Row -->
    <div class="kpi-grid" id="kpiRow" role="region" aria-label="Key metrics">
      <div class="kpi-card skeleton" style="height:88px;"></div>
      <div class="kpi-card skeleton" style="height:88px;"></div>
      <div class="kpi-card skeleton" style="height:88px;"></div>
      <div class="kpi-card skeleton" style="height:88px;"></div>
    </div>

    <!-- Charts Row -->
    <section id="chartsWrap" class="hidden" aria-label="Data visualizations">
      <div>
        <article class="card">
          <h3>Event Composition</h3>
          <p class="muted" style="font-size:0.78rem; margin-top:-0.5rem;">Distribution of event types across all collected data</p>
          <div id="eventTypeChart"></div>
        </article>
      </div>
    </section>

    <!-- Recent Events Table -->
    <section id="eventsWrap" class="hidden" aria-label="Recent events">
      <article class="card">
        <div class="flex items-center justify-between mb-1">
          <h3 class="mb-0">Recent Events</h3>
          <span class="muted" style="font-size:0.75rem;" id="eventCount"></span>
        </div>
        <div class="table-wrap">
          <table id="eventsTable" aria-label="Recent analytics events">
            <thead>
              <tr>
                <th scope="col">Type</th>
                <th scope="col">URL</th>
                <th scope="col">Session</th>
                <th scope="col">Timestamp</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </article>
    </section>

    <!-- Admin Section -->
    <section id="adminSection" class="hidden" aria-label="User management">
      <article class="card">
        <h3>User Management</h3>
        <ul id="adminUsers" class="user-list" role="list"></ul>
      </article>
    </section>

  </main>

  <script>
    var API = '/api';
    var ZC = {
      g: { backgroundColor: 'transparent', borderWidth: 0, plotarea: { margin: '48 24 56 56' } },
      tt: { backgroundColor: '#0f2b38', fontColor: '#fff', fontSize: '12px', fontFamily: 'system-ui', borderRadius: '6px', padding: '8px 12px', shadow: false },
      sx: { lineColor: 'rgba(136,183,196,0.3)', tick: { lineColor: 'rgba(136,183,196,0.3)' }, item: { fontColor: '#4a5568', fontSize: '10px' }, guide: { visible: false } },
      sy: { lineColor: 'transparent', tick: { visible: false }, item: { fontColor: '#94a3b8', fontSize: '10px' }, guide: { lineColor: 'rgba(136,183,196,0.12)', lineStyle: 'solid' } },
      anim: { animation: { effect: 'ANIMATION_EXPAND_BOTTOM', method: 'ANIMATION_BACK_EASE_OUT', sequence: 'ANIMATION_BY_PLOT', speed: 600 } }
    };

    function show(id, v) { document.getElementById(id).classList.toggle('hidden', !v); }

    function buildKPI(label, value, unit, variant) {
      return '<div class="kpi-card' + (variant ? ' kpi-' + variant : '') + '">' +
        '<div class="kpi-label">' + label + '</div>' +
        '<div class="kpi-value">' + value + '<span class="kpi-unit">' + (unit || '') + '</span></div></div>';
    }

    function cssHBar(items, color) {
      var max = Math.max.apply(null, items.map(function(i) { return i.value; }));
      return '<div class="css-hbar" role="img" aria-label="Horizontal bar chart">' +
        items.map(function(i) {
          var pct = max > 0 ? (i.value / max * 100) : 0;
          return '<div class="css-hbar-row">' +
            '<span class="css-hbar-label" title="' + i.label + '">' + i.label + '</span>' +
            '<div class="css-hbar-track"><div class="css-hbar-fill ' + (color || '') + '" style="width:' + pct + '%"></div></div>' +
            '<span class="css-hbar-val">' + i.value.toLocaleString() + '</span></div>';
        }).join('') + '</div>';
    }

    async function loadDashboard() {
      try {
        var config = await (await fetch(API + '/dashboard/config')).json();
        document.getElementById('welcome').textContent = 'Welcome back, ' + config.user.displayName;
        document.getElementById('accessInfo').textContent = 'Signed in as ' + config.user.role.replace('_', ' ');
        document.getElementById('permissionPills').innerHTML = config.user.sections.map(function(s) { return '<span class="pill">' + s + '</span>'; }).join('');

        var hasPerf = config.sections.performance;
        var hasBehav = config.sections.behavioral;

        show('chartsWrap', hasPerf);
        show('eventsWrap', hasPerf || hasBehav);
        show('adminSection', config.sections.admin);

        if (config.sections.admin) loadAdminUsers();

        var summaryRes = hasPerf ? fetch(API + '/stats/summary') : null;
        var eventsRes = (hasPerf || hasBehav) ? fetch(API + '/events?limit=25') : null;

        var summary = summaryRes ? await (await summaryRes).json() : null;
        var events = eventsRes ? await (await eventsRes).json() : [];

        // KPI cards
        var kpiRow = document.getElementById('kpiRow');
        if (summary) {
          var errCount = 0;
          if (summary.event_types) {
            var errType = summary.event_types.find(function(t) { return t.event_type === 'error'; });
            if (errType) errCount = errType.count;
          }
          kpiRow.innerHTML = [
            buildKPI('Total Events', (summary.total_events || 0).toLocaleString(), '', 'teal'),
            buildKPI('Unique Sessions', (summary.unique_sessions || 0).toLocaleString(), ''),
            buildKPI('Event Types', (summary.event_types || []).length, 'types'),
            buildKPI('Error Rate', (errCount / Math.max(summary.total_events, 1) * 100).toFixed(1), '%', 'coral')
          ].join('');
        } else {
          kpiRow.innerHTML = '';
        }

        if (hasPerf && summary) {
          var perfData = await (await fetch(API + '/stats/performance')).json();

          // Event types — CSS horizontal bars (simple single-series)
          var types = (summary.event_types || []).sort(function(a, b) { return b.count - a.count; });
          if (types.length > 0) {
            document.getElementById('eventTypeChart').innerHTML = cssHBar(
              types.map(function(t) { return { label: t.event_type || 'unknown', value: t.count }; })
            );
          }

          // Traffic area chart — ZingChart (complex spline time-series)
          if (typeof zingchart !== 'undefined' && perfData.volumeByHour.length > 0) {
            try {
              zingchart.render({
                id: 'trafficChart',
                data: {
                  ...ZC.g, type: 'area',
                  scaleX: { ...ZC.sx, labels: perfData.volumeByHour.map(function(r) { var p = r.hour_bucket.split(' '); return p[1] || r.hour_bucket; }) },
                  scaleY: ZC.sy,
                  tooltip: ZC.tt,
                  plot: { ...ZC.anim, aspect: 'spline', lineWidth: '2px', marker: { visible: false }, alphaArea: 0.15 },
                  series: [{ values: perfData.volumeByHour.map(function(r) { return r.count; }), lineColor: '#2c5f7c', backgroundColor: '#2c5f7c' }]
                },
                height: 340, width: '100%'
              });
            } catch (e) { console.warn('Traffic chart render failed:', e); }
          }
        }

        // Recent events — plain HTML table
        if (events.length > 0) {
          document.getElementById('eventCount').textContent = 'Showing latest ' + events.length;
          document.querySelector('#eventsTable tbody').innerHTML = events.map(function(e) {
            return '<tr><td>' + (e.event_type || 'unknown') + '</td>' +
              '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (e.url || '') + '</td>' +
              '<td class="mono">' + (e.session_id ? e.session_id.substring(0, 10) : '—') + '</td>' +
              '<td style="white-space:nowrap;font-size:0.78rem;">' + (e.server_timestamp || '') + '</td></tr>';
          }).join('');
        }

      } catch (err) {
        console.error('Dashboard load failed:', err);
        document.getElementById('kpiRow').innerHTML = '<p class="muted">Failed to load dashboard data.</p>';
      }
    }

    async function loadAdminUsers() {
      var res = await fetch(API + '/auth/users');
      if (!res.ok) return;
      var users = (await res.json()).users;
      document.getElementById('adminUsers').innerHTML = users.map(function(u) {
        return '<li class="user-item"><div class="user-info">' +
          '<span class="user-name">' + u.displayName + ' <span class="muted" style="font-weight:400;">@' + u.username + '</span></span>' +
          '<span class="user-meta">' + u.role.replace('_', ' ') + ' · ' + (u.sections || []).join(', ') + '</span></div>' +
          (u.role !== 'super_admin' ? '<button class="btn-sm btn-danger" onclick="deleteUser(' + u.id + ',\'' + u.username + '\')">Remove</button>' : '') +
          '</li>';
      }).join('');
    }

    async function deleteUser(id, name) {
      if (!confirm('Remove user "' + name + '"?')) return;
      var r = await fetch(API + '/auth/users/' + id, { method: 'DELETE' });
      if (r.ok) loadAdminUsers();
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
