<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Analytics Reporting</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.zingchart.com/zingchart.min.js" defer></script>
  <script src="https://cdn.zinggrid.com/zinggrid.min.js" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <noscript><div class="noscript-warning">JavaScript is required to use this application.</div></noscript>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <h1>Analytics Reporting</h1>
      <nav aria-label="Main navigation">
        <a href="/dashboard" class="active" aria-current="page">Dashboard</a>
        <a href="/reports">Reports</a>
        <a href="/logout">Logout</a>
      </nav>
    </div>
  </header>

  <div class="page-title-bar">
    <div class="title-inner">
      <div>
        <h2 id="welcome">Loading...</h2>
        <p class="subtitle" id="accessInfo"></p>
      </div>
      <div id="permissionPills"></div>
    </div>
  </div>

  <main id="main-content" class="container">

    <!-- KPI Row -->
    <div class="kpi-grid" id="kpiRow" role="region" aria-label="Key metrics">
      <div class="kpi-card skeleton" style="height:88px;"></div>
      <div class="kpi-card skeleton" style="height:88px;"></div>
      <div class="kpi-card skeleton" style="height:88px;"></div>
      <div class="kpi-card skeleton" style="height:88px;"></div>
    </div>

    <!-- Charts Row -->
    <section id="chartsWrap" class="hidden" aria-label="Data visualizations">
      <div class="grid-2">
        <article class="card">
          <h3>Traffic Over Time</h3>
          <p class="muted" style="font-size:0.78rem; margin-top:-0.5rem;">Hourly event volume — identifies peak usage and traffic patterns</p>
          <div id="trafficChart" class="chart-container"></div>
        </article>
        <article class="card">
          <h3>Event Composition</h3>
          <p class="muted" style="font-size:0.78rem; margin-top:-0.5rem;">Distribution of event types across all collected data</p>
          <div id="eventTypeChart" class="chart-container"></div>
        </article>
      </div>
    </section>

    <!-- Recent Events Table (ZingGrid) -->
    <section id="eventsWrap" class="hidden" aria-label="Recent events">
      <article class="card">
        <div class="flex items-center justify-between mb-1">
          <h3 class="mb-0">Recent Events</h3>
          <span class="muted" style="font-size:0.75rem;" id="eventCount"></span>
        </div>
        <zing-grid id="eventsGrid"
          layout="row"
          pager
          page-size="10"
          sort
          search
          no-data="No events loaded yet"
          aria-label="Recent analytics events">
          <zg-colgroup>
            <zg-column index="event_type" header="Type"></zg-column>
            <zg-column index="url" header="URL"></zg-column>
            <zg-column index="session_id" header="Session"></zg-column>
            <zg-column index="server_timestamp" header="Timestamp"></zg-column>
          </zg-colgroup>
        </zing-grid>
      </article>
    </section>

    <!-- Admin Section -->
    <section id="adminSection" class="hidden" aria-label="User management">
      <article class="card">
        <h3>User Management</h3>
        <ul id="adminUsers" class="user-list" role="list"></ul>
      </article>
    </section>

  </main>

  <script>
    const API = '/api';
    const OCEAN_THEME = {
      palette: ['#2c5f7c', '#3a8a9e', '#88b7c4', '#c9553d', '#e8735c', '#b8d8e2', '#0f2b38'],
      graph: {
        backgroundColor: 'transparent',
        borderWidth: 0,
        plotarea: { margin: '48 24 56 56' }
      },
      title: { fontFamily: 'system-ui', fontSize: '13px', fontWeight: '700', fontColor: '#0f2b38', textAlign: 'left', paddingLeft: '4px' },
      tooltip: {
        backgroundColor: '#0f2b38',
        fontColor: '#fff',
        fontSize: '12px',
        fontFamily: 'system-ui',
        borderRadius: '6px',
        padding: '8px 12px',
        shadow: false
      },
      scaleX: { lineColor: 'rgba(136,183,196,0.3)', tick: { lineColor: 'rgba(136,183,196,0.3)' }, item: { fontColor: '#4a5568', fontSize: '10px' }, guide: { visible: false } },
      scaleY: { lineColor: 'transparent', tick: { visible: false }, item: { fontColor: '#94a3b8', fontSize: '10px' }, guide: { lineColor: 'rgba(136,183,196,0.12)', lineStyle: 'solid' } },
      legend: { layout: 'float', backgroundColor: 'transparent', borderWidth: 0, item: { fontColor: '#4a5568', fontSize: '11px' }, marker: { borderRadius: '3px' } },
      plot: { animation: { effect: 'ANIMATION_EXPAND_BOTTOM', method: 'ANIMATION_BACK_EASE_OUT', sequence: 'ANIMATION_BY_PLOT', speed: 600 } }
    };

    function show(id, shouldShow) {
      document.getElementById(id).classList.toggle('hidden', !shouldShow);
    }

    function buildKPI(label, value, unit, variant) {
      return `<div class="kpi-card${variant ? ' kpi-' + variant : ''}">
        <div class="kpi-label">${label}</div>
        <div class="kpi-value">${value}<span class="kpi-unit">${unit || ''}</span></div>
      </div>`;
    }

    async function loadDashboard() {
      try {
        const config = (await (await fetch(`${API}/dashboard/config`)).json());
        document.getElementById('welcome').textContent = `Welcome back, ${config.user.displayName}`;
        document.getElementById('accessInfo').textContent = `Signed in as ${config.user.role.replace('_', ' ')}`;

        const pills = document.getElementById('permissionPills');
        pills.innerHTML = config.user.sections.map(s => `<span class="pill">${s}</span>`).join('');

        const hasPerf = config.sections.performance;
        const hasBehav = config.sections.behavioral;

        show('chartsWrap', hasPerf);
        show('eventsWrap', hasPerf || hasBehav);
        show('adminSection', config.sections.admin);

        if (config.sections.admin) loadAdminUsers();

        const [summaryRes, eventsRes] = await Promise.all([
          hasPerf ? fetch(`${API}/stats/summary`) : null,
          (hasPerf || hasBehav) ? fetch(`${API}/events?limit=25`) : null
        ].filter(Boolean));

        const summary = hasPerf ? await summaryRes.json() : null;
        const events = (hasPerf || hasBehav) ? await eventsRes.json() : [];

        // KPI cards
        const kpiRow = document.getElementById('kpiRow');
        if (summary) {
          kpiRow.innerHTML = [
            buildKPI('Total Events', (summary.total_events || 0).toLocaleString(), '', 'teal'),
            buildKPI('Unique Sessions', (summary.unique_sessions || 0).toLocaleString(), ''),
            buildKPI('Event Types', (summary.event_types || []).length, 'types'),
            buildKPI('Error Rate',
              summary.event_types
                ? ((summary.event_types.find(t => t.event_type === 'error')?.count || 0) / Math.max(summary.total_events, 1) * 100).toFixed(1)
                : '0',
              '%', 'coral')
          ].join('');
        } else {
          kpiRow.innerHTML = '';
        }

        // Traffic chart (hourly bucketed from summary recent events isn't great — use events)
        if (hasPerf && summary) {
          const perfData = await (await fetch(`${API}/stats/performance`)).json();

          if (perfData.volumeByHour.length > 0) {
            const labels = perfData.volumeByHour.map(r => {
              const parts = r.hour_bucket.split(' ');
              return parts[1] || r.hour_bucket;
            });

            zingchart.render({
              id: 'trafficChart',
              data: {
                ...OCEAN_THEME.graph,
                type: 'area',
                scaleX: { ...OCEAN_THEME.scaleX, labels, label: { text: '' } },
                scaleY: { ...OCEAN_THEME.scaleY, label: { text: '' } },
                title: { ...OCEAN_THEME.title, text: '' },
                tooltip: OCEAN_THEME.tooltip,
                plot: {
                  ...OCEAN_THEME.plot,
                  aspect: 'spline',
                  lineWidth: '2px',
                  marker: { visible: false },
                  alphaArea: 0.15
                },
                series: [{
                  values: perfData.volumeByHour.map(r => r.count),
                  lineColor: '#2c5f7c',
                  backgroundColor: '#2c5f7c'
                }]
              },
              height: 340, width: '100%'
            });
          }

          // Event type chart — horizontal bar instead of pie for readability
          const types = (summary.event_types || []).sort((a, b) => b.count - a.count);
          if (types.length > 0) {
            zingchart.render({
              id: 'eventTypeChart',
              data: {
                ...OCEAN_THEME.graph,
                type: 'hbar',
                scaleX: { ...OCEAN_THEME.scaleX, labels: types.map(t => t.event_type || 'unknown') },
                scaleY: { ...OCEAN_THEME.scaleY, label: { text: '' } },
                title: { ...OCEAN_THEME.title, text: '' },
                tooltip: { ...OCEAN_THEME.tooltip, text: '%data-type: %v events' },
                plot: {
                  ...OCEAN_THEME.plot,
                  barWidth: '60%',
                  borderRadius: '3px',
                  valueBox: { text: '%v', placement: 'out', fontColor: '#4a5568', fontSize: '10px' }
                },
                series: [{
                  values: types.map(t => t.count),
                  backgroundColor: '#3a8a9e',
                  'data-type': types.map(t => t.event_type)
                }]
              },
              height: 340, width: '100%'
            });
          }
        }

        // Recent events — populate ZingGrid
        if (events.length > 0) {
          document.getElementById('eventCount').textContent = `Showing latest ${events.length}`;
          const gridData = events.map(e => ({
            event_type: e.event_type || 'unknown',
            url: e.url || '',
            session_id: e.session_id ? e.session_id.substring(0, 10) : '—',
            server_timestamp: e.server_timestamp || ''
          }));
          const grid = document.getElementById('eventsGrid');
          grid.setData(gridData);
        }

      } catch (err) {
        console.error('Dashboard load failed:', err);
        document.getElementById('kpiRow').innerHTML = '<p class="muted">Failed to load dashboard data.</p>';
      }
    }

    async function loadAdminUsers() {
      const res = await fetch(`${API}/auth/users`);
      if (!res.ok) return;
      const { users } = await res.json();
      const list = document.getElementById('adminUsers');
      list.innerHTML = users.map(u => `
        <li class="user-item">
          <div class="user-info">
            <span class="user-name">${u.displayName} <span class="muted" style="font-weight:400;">@${u.username}</span></span>
            <span class="user-meta">${u.role.replace('_', ' ')} · ${(u.sections || []).join(', ')}</span>
          </div>
          ${u.role !== 'super_admin' ? `<button class="btn-sm btn-danger" onclick="deleteUser(${u.id}, '${u.username}')">Remove</button>` : ''}
        </li>
      `).join('');
    }

    async function deleteUser(id, name) {
      if (!confirm('Remove user "' + name + '"?')) return;
      const r = await fetch(`${API}/auth/users/${id}`, { method: 'DELETE' });
      if (r.ok) loadAdminUsers();
    }

    loadDashboard();
  </script>
</body>
</html>
