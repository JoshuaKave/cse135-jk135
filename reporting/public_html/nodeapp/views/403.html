<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 — Access Denied</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="header-inner">
      <h1>Analytics Reporting</h1>
      <nav aria-label="Main navigation">
        <a href="/dashboard">Dashboard</a>
        <a href="/reports">Reports</a>
        <a href="/logout">Logout</a>
      </nav>
    </div>
  </header>

  <main class="container error-page" role="main">
    <div class="error-code" aria-hidden="true">403</div>
    <p class="error-message">Access Denied</p>
    <p class="error-detail">Your current role or section permissions don't include access to this resource. Contact an administrator if you believe this is an error.</p>
    <a href="/dashboard" class="btn">Back to Dashboard</a>
  </main>
</body>
</html>
